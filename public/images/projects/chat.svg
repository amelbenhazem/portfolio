<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <rect width="800" height="420" fill="#141925"/>
  <text x="400" y="40" text-anchor="middle" fill="#F7F7F7" font-size="16" font-weight="bold">Chat App MERN</text>
  <!-- Chat window -->
  <rect x="100" y="60" width="600" height="320" rx="12" fill="#0B0F19" stroke="#374151"/>
  <!-- Messages left -->
  <rect x="130" y="90" width="200" height="50" rx="12" fill="#202731"/>
  <rect x="140" y="100" width="120" height="6" rx="3" fill="#9FA7A9"/>
  <rect x="140" y="115" width="160" height="6" rx="3" fill="#374151"/>
  <!-- Messages right -->
  <rect x="470" y="160" width="200" height="50" rx="12" fill="#9EDEEE" opacity="0.2" stroke="#9EDEEE"/>
  <rect x="480" y="170" width="120" height="6" rx="3" fill="#9EDEEE"/>
  <rect x="480" y="185" width="160" height="6" rx="3" fill="#9FA7A9"/>
  <rect x="130" y="230" width="250" height="50" rx="12" fill="#202731"/>
  <rect x="140" y="240" width="140" height="6" rx="3" fill="#9FA7A9"/>
  <rect x="140" y="255" width="200" height="6" rx="3" fill="#374151"/>
  <!-- Input -->
  <rect x="130" y="330" width="540" height="36" rx="18" fill="#202731" stroke="#374151"/>
  <circle cx="650" cy="348" r="14" fill="#9EDEEE"/>
</svg>
