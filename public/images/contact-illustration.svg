<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <rect width="400" height="350" fill="transparent"/>
  <!-- Envelope -->
  <rect x="220" y="80" width="120" height="80" rx="8" fill="#202731" stroke="#9EDEEE" stroke-width="2"/>
  <path d="M220 80 L280 130 L340 80" stroke="#9EDEEE" stroke-width="2" fill="none"/>
  <!-- Character -->
  <ellipse cx="160" cy="240" rx="45" ry="50" fill="#9EDEEE"/>
  <circle cx="160" cy="170" r="38" fill="#D8E1EA"/>
  <ellipse cx="160" cy="145" rx="40" ry="24" fill="#202731"/>
  <!-- Phone -->
  <rect x="200" y="200" width="50" height="90" rx="8" fill="#141925" stroke="#374151" stroke-width="2"/>
  <rect x="208" y="212" width="34" height="60" rx="3" fill="#0B0F19"/>
  <circle cx="225" cy="282" r="6" fill="#374151"/>
  <!-- Speech bubble -->
  <rect x="60" y="100" width="100" height="60" rx="12" fill="#202731" stroke="#9CB7CA" stroke-width="1.5"/>
  <polygon points="100,160 90,180 120,160" fill="#202731"/>
  <text x="110" y="128" text-anchor="middle" fill="#9CB7CA" font-size="11">Hello!</text>
  <text x="110" y="145" text-anchor="middle" fill="#9FA7A9" font-size="10">Contact me</text>
  <!-- Decorative dots -->
  <circle cx="320" cy="280" r="6" fill="#9EDEEE" opacity="0.6"/>
  <circle cx="340" cy="300" r="4" fill="#9CB7CA" opacity="0.6"/>
  <circle cx="50" cy="280" r="5" fill="#9EDEEE" opacity="0.4"/>
</svg>
