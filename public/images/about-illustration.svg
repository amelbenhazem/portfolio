  <line x1="242" y1="204" x2="258" y2="204" stroke="#202731" stroke-width="2"/>
  <!-- Tablet -->
  <rect x="300" y="240" width="100" height="130" rx="10" fill="#141925" stroke="#374151" stroke-width="2"/>
