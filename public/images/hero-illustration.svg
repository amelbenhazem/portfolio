<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <rect width="600" height="500" fill="#0B0F19"/>
  <!-- Background circle -->
  <circle cx="300" cy="250" r="180" fill="#202731" opacity="0.5"/>
  <circle cx="300" cy="250" r="140" fill="#9EDEEE" opacity="0.08"/>
  <!-- Desk -->
  <rect x="120" y="340" width="360" height="12" rx="6" fill="#202731"/>
  <rect x="140" y="352" width="8" height="60" fill="#202731"/>
  <rect x="452" y="352" width="8" height="60" fill="#202731"/>
  <!-- Laptop -->
  <rect x="200" y="280" width="200" height="130" rx="8" fill="#141925" stroke="#374151" stroke-width="2"/>
  <rect x="210" y="290" width="180" height="100" rx="4" fill="#0B0F19"/>
  <rect x="220" y="300" width="60" height="4" rx="2" fill="#9EDEEE"/>
  <rect x="220" y="312" width="100" height="3" rx="1.5" fill="#9FA7A9"/>
  <rect x="220" y="322" width="80" height="3" rx="1.5" fill="#9FA7A9"/>
  <rect x="220" y="340" width="140" height="30" rx="4" fill="#202731"/>
  <rect x="180" y="410" width="240" height="8" rx="4" fill="#374151"/>
  <!-- Character body -->
  <ellipse cx="300" cy="200" rx="45" ry="50" fill="#9EDEEE"/>
  <!-- Head -->
  <circle cx="300" cy="130" r="40" fill="#D8E1EA"/>
  <!-- Hair -->
  <ellipse cx="300" cy="105" rx="42" ry="25" fill="#202731"/>
  <!-- Glasses -->
  <rect x="268" y="125" width="22" height="16" rx="4" fill="none" stroke="#202731" stroke-width="2"/>
  <rect x="310" y="125" width="22" height="16" rx="4" fill="none" stroke="#202731" stroke-width="2"/>
  <line x1="290" y1="133" x2="310" y2="133" stroke="#202731" stroke-width="2"/>
  <!-- Smile -->
  <path d="M288 148 Q300 158 312 148" stroke="#202731" stroke-width="2" fill="none"/>
  <!-- Arms -->
  <rect x="240" y="190" width="30" height="12" rx="6" fill="#D8E1EA" transform="rotate(-20 255 196)"/>
  <rect x="330" y="190" width="30" height="12" rx="6" fill="#D8E1EA" transform="rotate(20 345 196)"/>
  <!-- Floating icons -->
  <circle cx="100" cy="180" r="30" fill="#202731" stroke="#9EDEEE" stroke-width="1.5"/>
  <text x="100" y="186" text-anchor="middle" fill="#9EDEEE" font-size="20"></text>
  <circle cx="500" cy="160" r="30" fill="#202731" stroke="#9CB7CA" stroke-width="1.5"/>
  <text x="500" y="166" text-anchor="middle" fill="#9CB7CA" font-size="16">JS</text>
  <circle cx="480" cy="320" r="28" fill="#202731" stroke="#9EDEEE" stroke-width="1.5"/>
  <text x="480" y="326" text-anchor="middle" fill="#9EDEEE" font-size="14">Dev</text>
